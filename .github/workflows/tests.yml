name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --no-deps -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python -m ruff check src tests app.py
      - run: python -m ruff format --check src tests app.py
      - run: python -m pytest -q
      - name: Synthetic CLI and report verification
        run: |
          python -m quant_fund.cli demo --out data/ci-demo
          python -m quant_fund.cli validate --dataset data/ci-demo
          python -m quant_fund.cli run --dataset data/ci-demo --strategy equal --start 2024-01-02 --end 2024-05-31 --out artifacts/ci-smoke
          python -m quant_fund.cli verify-run artifacts/ci-smoke
